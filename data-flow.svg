<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141a1f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b90c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f2b90c" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="894" height="414" rx="22" ry="22" fill="url(#bgGlow)" stroke="#f2b90c" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="450" y="42" text-anchor="middle" fill="#f2b90c" font-size="21" font-weight="700" letter-spacing="1.5">
    APIKUR RAHAMAN MOLLA :: DATA PIPELINE
  </text>
  <text x="450" y="65" text-anchor="middle" fill="#8b949e" font-size="12.5" letter-spacing="0.5">
    Raw Data → Modeling → Insight, animated
  </text>

  <!-- ================= EDGES (layer1 -> layer2) ================= -->
  <g stroke="url(#edgeGrad)" stroke-width="1.4" fill="none">
    <path id="e11" d="M195,130 C320,130 320,110 430,110"/>
    <path id="e12" d="M195,130 C320,130 320,215 430,215"/>
    <path id="e13" d="M195,130 C320,130 320,320 430,320"/>

    <path id="e21" d="M195,215 C320,215 320,110 430,110"/>
    <path id="e22" d="M195,215 C320,215 320,215 430,215"/>
    <path id="e23" d="M195,215 C320,215 320,320 430,320"/>

    <path id="e31" d="M195,300 C320,300 320,110 430,110"/>
    <path id="e32" d="M195,300 C320,300 320,215 430,215"/>
    <path id="e33" d="M195,300 C320,300 320,320 430,320"/>
  </g>

  <!-- ================= EDGES (layer2 -> layer3) ================= -->
  <g stroke="url(#edgeGrad)" stroke-width="1.4" fill="none">
    <path id="f1" d="M475,110 C600,110 600,215 705,215"/>
    <path id="f2" d="M475,215 C600,215 600,215 705,215"/>
    <path id="f3" d="M475,320 C600,320 600,215 705,215"/>
  </g>

  <!-- ================= TRAVELING PULSES ================= -->
  <g fill="#f2b90c">
    <circle r="3" opacity="0.9"><animateMotion dur="3.2s" begin="0s"    repeatCount="indefinite"><mpath href="#e11"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.6s" begin="0.3s"  repeatCount="indefinite"><mpath href="#e12"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.0s" begin="0.6s"  repeatCount="indefinite"><mpath href="#e13"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.4s" begin="0.9s"  repeatCount="indefinite"><mpath href="#e21"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.1s" begin="1.2s"  repeatCount="indefinite"><mpath href="#e22"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.5s" begin="1.5s"  repeatCount="indefinite"><mpath href="#e23"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.3s" begin="1.8s"  repeatCount="indefinite"><mpath href="#e31"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.7s" begin="2.1s"  repeatCount="indefinite"><mpath href="#e32"/></animateMotion></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="2.9s" begin="2.4s"  repeatCount="indefinite"><mpath href="#e33"/></animateMotion></circle>

    <circle r="3.6" opacity="0.95"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#f1"/></animateMotion></circle>
    <circle r="3.6" opacity="0.95"><animateMotion dur="2.3s" begin="0.9s" repeatCount="indefinite"><mpath href="#f2"/></animateMotion></circle>
    <circle r="3.6" opacity="0.95"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#f3"/></animateMotion></circle>
  </g>

  <!-- ================= LAYER 1 : SOURCES ================= -->
  <g text-anchor="middle">
    <g filter="url(#softGlow)">
      <circle cx="170" cy="130" r="26" fill="#161b22" stroke="#f2b90c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="215" r="26" fill="#161b22" stroke="#f2b90c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="300" r="26" fill="#161b22" stroke="#f2b90c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="170" y="136" fill="#e6edf3" font-size="12" font-weight="600">SQL</text>
    <text x="170" y="221" fill="#e6edf3" font-size="12" font-weight="600">CSV</text>
    <text x="170" y="306" fill="#e6edf3" font-size="12" font-weight="600">API</text>
    <text x="170" y="352" fill="#8b949e" font-size="12">Sources</text>
  </g>

  <!-- ================= LAYER 2 : PROCESSING ================= -->
  <g text-anchor="middle">
    <g filter="url(#softGlow)">
      <circle cx="452" cy="110" r="26" fill="#161b22" stroke="#f2b90c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="452" cy="215" r="26" fill="#161b22" stroke="#f2b90c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="452" cy="320" r="26" fill="#161b22" stroke="#f2b90c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="452" y="114" fill="#e6edf3" font-size="11.5" font-weight="600">Python</text>
    <text x="452" y="219" fill="#e6edf3" font-size="11" font-weight="600">Power BI</text>
    <text x="452" y="324" fill="#e6edf3" font-size="12" font-weight="600">ML</text>
    <text x="452" y="366" fill="#8b949e" font-size="12">Processing</text>
  </g>

  <!-- ================= LAYER 3 : OUTPUT ================= -->
  <g text-anchor="middle">
    <g filter="url(#softGlow)">
      <circle cx="735" cy="215" r="32" fill="#161b22" stroke="#f2b90c" stroke-width="2.4">
        <animate attributeName="r" values="32;35;32" dur="2s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="735" y="211" fill="#f2b90c" font-size="12" font-weight="700">DATA</text>
    <text x="735" y="225" fill="#f2b90c" font-size="12" font-weight="700">INSIGHT</text>
    <text x="735" y="266" fill="#8b949e" font-size="12">Decision</text>
  </g>
</svg>
